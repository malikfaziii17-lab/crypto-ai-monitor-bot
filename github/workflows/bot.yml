import requests
import feedparser
from datetime import datetime, timezone

COINS = ["bitcoin", "ethereum", "solana"]

def get_prices():
    ids = ",".join(COINS)

    url = "https://api.coingecko.com/api/v3/simple/price"
    params = {
        "ids": ids,
        "vs_currencies": "usd",
        "include_24hr_change": "true"
    }

    response = requests.get(url, params=params, timeout=20)
    response.raise_for_status()

    return response.json()


def get_news():
    feed_url = "https://www.coindesk.com/arc/outboundfeeds/rss/"
    feed = feedparser.parse(feed_url)

    news = []

    for item in feed.entries[:5]:
        news.append(item.title)

    return news


def main():
    print("=" * 50)
    print("CRYPTO AI MONITOR BOT")
    print(datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC"))
    print("=" * 50)

    try:
        prices = get_prices()

        print("\nMARKET:")
        for coin in COINS:
            data = prices.get(coin, {})
            price = data.get("usd", "N/A")
            change = data.get("usd_24h_change", "N/A")

            print(f"{coin.upper()}: ${price} | 24h: {change}%")

    except Exception as e:
        print("Price API error:", e)

    try:
        news = get_news()

        print("\nLATEST NEWS:")
        for i, title in enumerate(news, 1):
            print(f"{i}. {title}")

    except Exception as e:
        print("News error:", e)

    print("\nMonitor completed successfully.")


if __name__ == "__main__":
    main()
